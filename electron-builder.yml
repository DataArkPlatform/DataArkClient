appId: com.dataark.dataart
productName: 语料方舟
copyright: Copyright © 2026 DataArk
# better-sqlite3@13 为 N-API，包内已带各平台预编译二进制，electron 可直接加载；
# 不重建原生模块，避免打包时再次触发 node-gyp（无 VS 工具链会失败）
npmRebuild: false
directories:
  output: release/${version}
files:
  - out/**
  - package.json
  - "!**/.vscode/**"
  - "!src/**"
  - "!docs/**"
  - "!design/**"
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: 语料方舟
  installerLanguages:
    - zh_CN
  deleteAppDataOnUninstall: false
# macOS —— 未签名分发（内测/开源）：identity: null 关闭签名与公证
# better-sqlite3@13 采用 prebuildify，包内自带 darwin-arm64/darwin-x64 二进制，
# 配合 npmRebuild:false 可直接交叉打包，无需在 mac 上重建原生模块。
mac:
  # macOS .icns 要求 ≥512×512；此处使用由 build/icon.png 放大的 1024×1024 占位图，
  # 有正式 1024 源图后可直接替换本文件（保持同名即可）。
  icon: build/icon-1024.png
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  title: ${productName}
